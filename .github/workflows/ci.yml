name: CI

on:
  pull_request:
  push:
    branches: [main]

# New pushes to a branch supersede in-flight runs for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always-on quality gate (no secrets). Make this a REQUIRED check in
  #    branch protection once it's been green for a bit. ──────────────────────
  quality:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the supabase client module-loads during jest/build.
      # Every test mocks the network/auth; no real endpoint is contacted.
      # build:web also reads the committed .env, so real values aren't required.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy.anon.key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      # Guards. `check-no-fs-root-import` and the i18n guards are invoked DIRECTLY
      # (node scripts/…, not via an npm script) on purpose: @expo/fingerprint
      # hashes package.json `scripts`, so registering a NEW script there would
      # drift the EAS runtimeVersion off the live binary and silently kill OTA
      # delivery (2026-07-24 dead-OTA incident). no-raw-alert is already in the
      # shipped script set (fingerprint-neutral) so it stays as `npm run`.
      # The i18n guards' pre-existing debt (ParentRewardsScreen, onboarding test
      # files) was cleared in the L2 cleanup, so they now gate every PR.
      - name: Guards
        run: |
          node scripts/check-no-fs-root-import.js
          npm run check:no-raw-alert
          node scripts/check-bilingual-access.js
          node scripts/i18n-key-check.js
      - name: Web build (catches RN-Web bundle breaks; produces ./dist)
        run: npm run build:web

  # ── Onboarding E2E (Playwright). ADVISORY + opt-in: OFF unless the repo
  #    variable RUN_E2E='true' (or manual dispatch) AND staging secrets exist.
  #    Needs a STAGING Supabase + a captured parent session — never prod.
  #    See e2e/README.md. (Fresh-parent session seeding is a planned follow-up.)
  e2e-web:
    needs: quality
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Build web (staging env)
        run: npm run build:web
      - name: Restore captured parent session
        run: |
          mkdir -p e2e/.auth
          printf '%s' "${{ secrets.BUFF_STORAGE_STATE_B64 }}" | base64 -d > e2e/.auth/parent.json
      - name: Run onboarding E2E (web)
        env:
          BUFF_STORAGE_STATE: e2e/.auth/parent.json
        run: npm run test:e2e:web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report
          if-no-files-found: ignore
