name: Fingerprint diag (throwaway)

# TEMPORARY diagnostic for the broken auto-OTA fingerprint guard (2026-09-05).
# Dumps the raw `eas build:list` JSON shape so we can fix how the guard reads
# the live binary runtimeVersion. Delete after the guard fix is validated.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Dump build:list (no profile filter)
        run: |
          echo "===== build:list --platform android --status finished --limit 3 (no profile) ====="
          eas build:list --platform android --status finished --limit 3 --json --non-interactive \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const a=Array.isArray(j)?j:(j.builds||[]);console.log("count:",a.length);a.forEach((b,i)=>console.log(i,JSON.stringify({id:b.id,status:b.status,platform:b.platform,runtimeVersion:b.runtimeVersion,appVersion:b.appVersion,appBuildVersion:b.appBuildVersion,keys:Object.keys(b)})));}catch(e){console.log("PARSE FAIL:",e.message,"raw head:",d.slice(0,400))}})'
      - name: Dump build:list (--build-profile production)
        run: |
          echo "===== build:list --build-profile production ====="
          eas build:list --platform android --build-profile production --status finished --limit 3 --json --non-interactive \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const a=Array.isArray(j)?j:(j.builds||[]);console.log("count:",a.length);a.forEach((b,i)=>console.log(i,JSON.stringify({id:b.id,status:b.status,runtimeVersion:b.runtimeVersion})));}catch(e){console.log("PARSE FAIL:",e.message,"raw head:",d.slice(0,400))}})' || echo "build-profile variant errored"
      - name: Project fingerprint (for comparison)
        run: |
          echo "===== project fingerprint =====";
          eas fingerprint:generate --platform android --build-profile production --json --non-interactive \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log(JSON.stringify(j).slice(0,300))}catch(e){console.log("PARSE FAIL",e.message)}})'
